[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentboard"
version = "0.3.1"
description = "A local kanban board for coordinating parallel CLI coding agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentboard = "agentboard.cli:main"

[tool.setuptools.package-data]
agentboard = ["static/*"]
